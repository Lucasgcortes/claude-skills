<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- launch-motion TEMPLATE. Brand and format come from kit/theme.css + kit/format.js (generated by brand.py).
     Each scene is a .sc layer (.light or .dark). Scenes entering with M.wipe use .wipe;
     scenes entering with M.T.* start hidden (gsap.set below). Everything aligns to the safe-area left edge (var(--x0)). -->
<link rel="stylesheet" href="kit/theme.css">
<style>
/* project-specific layout goes here; keep sizes on the spacing scale 8/16/24/32/48/64/96 */
</style></head><body>
<div id="stage">
  <!-- 1: kicker + headline + card -->
  <div class="sc light" id="s1">
    <div class="kick" id="k1">New</div>
    <div class="title" id="t1"><span class="ln"><span class="base">Now you can</span></span><span class="ln"><span class="em">do it all</span> <span class="base">in one place</span></span></div>
    <div class="card" id="c1" style="left:var(--x0);top:calc(var(--y0) + 330px);width:var(--safe-w);height:520px"><img src="crops/example.png"></div>
  </div>
  <!-- 2: impact word -->
  <div class="sc dark punch wipe" id="p1"><div class="wd">Faster<span class="dot">.</span></div></div>
  <!-- 3: giant number -->
  <div class="sc light" id="g1"><div class="kick" style="top:calc(var(--y0) + 300px)">Orders per day</div>
    <div class="gnum" data-n="1,277" style="position:absolute;left:var(--x0);top:calc(var(--y0) + 360px)"></div></div>
  <!-- outro -->
  <div class="sc dark outro" id="end"><img class="logo" src="kit/logo-dark.svg"><div class="tag">yourbrand.com</div></div>
</div>
<script src="kit/gsap.min.js"></script><script src="kit/motion.js"></script><script src="kit/format.js"></script>
<script>
M.splitWords(); M.splitLetters(); M.buildRoll();
gsap.set('.sc:not(#s1):not(.wipe)', { autoAlpha: 0 });
const tl = M.tl;
M.kick('#k1', .2); M.title('#t1', .3); M.winOpen('#c1', .9);
M.wipe('#p1', 3.6); M.letters('#p1', 3.8); M.hide('#s1', 4.4);
M.T.sweep('#p1', '#g1', 5.6, 'accent'); M.roll('#g1', 6.1);
M.T.blur('#g1', '#end', 8.4); M.outro('#end', 8.6);
window.DUR = 11;
</script></body></html>
